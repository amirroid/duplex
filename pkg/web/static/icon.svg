<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Back Sheet (Rotated slightly) -->
  <g transform="translate(290, 240) rotate(14) translate(-290, -240)" filter="url(#shadow)">
    <rect x="200" y="120" width="180" height="240" rx="16" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <line x1="230" y1="160" x2="350" y2="160" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <line x1="230" y1="190" x2="330" y2="190" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <line x1="230" y1="220" x2="350" y2="220" stroke="#475569" stroke-width="6" stroke-linecap="round"/>
    <!-- Page 2 badge -->
    <circle cx="340" cy="320" r="16" fill="#475569"/>
    <text x="340" y="325" fill="#f8fafc" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">2</text>
  </g>

  <!-- Front Sheet -->
  <g filter="url(#shadow)">
    <rect x="130" y="150" width="180" height="240" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="3"/>
    <!-- Header banner -->
    <rect x="150" y="175" width="140" height="20" rx="6" fill="url(#cardGrad1)"/>
    <!-- Text lines -->
    <line x1="150" y1="220" x2="270" y2="220" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
    <line x1="150" y1="245" x2="250" y2="245" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    <line x1="150" y1="270" x2="280" y2="270" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    <line x1="150" y1="295" x2="230" y2="295" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round"/>
    <!-- Page 1 badge -->
    <circle cx="165" cy="350" r="16" fill="url(#cardGrad2)"/>
    <text x="165" y="355" fill="#ffffff" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle">1</text>
  </g>

  <!-- Duplex Circular Arrow Icon (Bottom Right) -->
  <g transform="translate(320, 290)" filter="url(#shadow)">
    <circle cx="50" cy="50" r="44" fill="url(#cardGrad1)" stroke="#ffffff" stroke-width="3"/>
    <!-- Dual flip arrow path -->
    <path d="M 32 46 C 34 36, 44 28, 56 28 C 68 28, 76 34, 80 42" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <polyline points="80 30, 80 42, 68 42" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <path d="M 68 54 C 66 64, 56 72, 44 72 C 32 72, 24 66, 20 58" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
    <polyline points="20 70, 20 58, 32 58" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
